<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Player Fullscreen</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script type="text/javascript">
    const urlParams = new URLSearchParams(window.location.search);
    const systemCore = urlParams.get('core') || 'snes'; 
    const gameFile = urlParams.get('game') || 'mario.sfc'; 

    EJS_player = '#game-container';
    EJS_core = systemCore; 
    EJS_gameUrl = 'roms/' + gameFile; 
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    EJS_startOnLoad = true;
    EJS_color = '#000000';
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

  <script>
    // Força a tela cheia e o modo paisagem absoluto no primeiro toque na tela
    function goFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
        elem.webkitRequestFullscreen();
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }

    window.addEventListener('click', goFullscreen, { once: true });
    window.addEventListener('touchstart', goFullscreen, { once: true });
  </script>
</body>
</html>
