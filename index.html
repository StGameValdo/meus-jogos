<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
  <title>Game Player Fullscreen</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script type="text/javascript">
    const urlParams = new URLSearchParams(window.location.search);
    const systemCore = urlParams.get('core') || 'snes'; 
    const gameFile = urlParams.get('game') || 'mario.sfc'; 

    EJS_player = '#game-container';
    EJS_core = systemCore; 
    EJS_gameUrl = 'roms/' + gameFile; 
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    // Força o emulador a tentar iniciar em tela cheia e modo paisagem se suportado
    EJS_fullScreen = true;
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

  <script>
    // Força o bloqueio da tela na horizontal (Landscape) no celular assim que carregar
    window.addEventListener('load', () => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {
          // Alguns navegadores exigem interação do usuário para bloquear a rotação
        });
      }
    });
  </script>
</body>
</html>
