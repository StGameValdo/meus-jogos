<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script type="text/javascript">
    const urlParams = new URLSearchParams(window.location.search);
    const systemCore = urlParams.get('core') || 'snes'; 
    const gameFile = urlParams.get('game') || 'mario.sfc'; 

    EJS_player = '#game-container';
    EJS_core = systemCore; 
    EJS_gameUrl = 'roms/' + gameFile; 
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    // Configurações para iniciar mais rápido e direto
    EJS_startOnLoad = true; // Tenta iniciar o carregamento automaticamente
    EJS_color = '#000000';
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

  <script>
    // Força a tela deitada (landscape) e tenta abrir em tela cheia no primeiro toque
    window.addEventListener('click', () => {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }, { once: true });
  </script>
</body>
</html>
